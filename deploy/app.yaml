apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrum-agent
  namespace: scrum-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scrum-agent
  template:
    metadata:
      labels:
        app: scrum-agent
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k3s-gpu-01
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z scrum-agent-db 5432; do
                echo "Waiting for database..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: migrate
          image: ghcr.io/cecedabro/scrum-agent:0.1.0 # {"$imagepolicy": "flux-system:scrum-agent"}
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          envFrom:
            - secretRef:
                name: scrum-agent-app
          env:
            - name: APP_ENV
              value: production
            - name: LLM_BASE_URL
              value: http://192.168.50.17:8080/v1
            - name: TEAM_USER
              value: team
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: web
          image: ghcr.io/cecedabro/scrum-agent:0.1.0 # {"$imagepolicy": "flux-system:scrum-agent"}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: scrum-agent-app
          env:
            - name: APP_ENV
              value: production
            - name: LLM_BASE_URL
              value: http://192.168.50.17:8080/v1
            - name: TEAM_USER
              value: team
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: scrum-agent
  namespace: scrum-agent
spec:
  selector:
    app: scrum-agent
  ports:
    - port: 80
      targetPort: 8000
