apiVersion: v1
kind: Service
metadata:
  name: scrum-agent-db
  namespace: scrum-agent
spec:
  selector:
    app: scrum-agent-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrum-agent-db
  namespace: scrum-agent
spec:
  serviceName: scrum-agent-db
  replicas: 1
  selector:
    matchLabels:
      app: scrum-agent-db
  template:
    metadata:
      labels:
        app: scrum-agent-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.10
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: scrum-agent-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            runAsNonRoot: false
            runAsUser: 999
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
  podManagementPolicy: OrderedReady
