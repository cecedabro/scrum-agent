[project]
name = "scrum-agent"
version = "0.1.0"
description = "Scrum assistant for a student team: deadlines, Teams reminders, meeting summaries"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.121.1",
    "uvicorn[standard]==0.38.0",
    "sqlalchemy==2.0.44",
    "alembic==1.17.1",
    "psycopg[binary]==3.2.12",
    "pydantic==2.12.4",
    "pydantic-settings==2.11.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "defusedxml==0.7.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.4",
    "mypy==1.18.2",
    "bandit==1.8.6",
    "pgserver==0.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test passwords

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.param_functions.Depends", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
