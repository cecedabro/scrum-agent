<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Scrum agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/app.js"></script>
</head>
<body>
    <nav aria-label="Hoofdnavigatie">
        <ul>
            <li><a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Overzicht</a></li>
            <li><a href="/deadlines" {% if request.url.path == "/deadlines" %}aria-current="page"{% endif %}>Deadlines</a></li>
            <li><a href="/meetings" {% if request.url.path == "/meetings" %}aria-current="page"{% endif %}>Vergaderingen</a></li>
            <li><a href="/settings" {% if request.url.path == "/settings" %}aria-current="page"{% endif %}>Instellingen</a></li>
            <li><a href="/privacy" {% if request.url.path == "/privacy" %}aria-current="page"{% endif %}>Privacy</a></li>
        </ul>
    </nav>
    <main>
        {% if page_title %}<h1>{{ page_title }}</h1>{% endif %}
        {% block content %}{% endblock %}
        {% if not deadlines and not meeting_jobs %}
        <p class="empty-state">Geen deadlines om te bekijken.</p>
        {% endif %}
    </main>
    <footer>
        <p>Scrum agent &mdash; HvA</p>
    </footer>
</body>
</html>
